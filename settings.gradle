pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = "https://maven.fabricmc.net/" }
    }
}

// Use the migrated Core directly during development. The substitution keeps the
// normal published SophisticatedCore coordinate intact for release builds.
includeBuild("../SophisticatedCore") {
    dependencySubstitution {
        substitute module("sophisticatedcore:sophisticatedcore") using project(":")
    }
}
