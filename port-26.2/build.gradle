plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = '26.2-port-dev'
group = 'sophisticatedbackpacks'

base {
    archivesName = 'sophisticatedbackpacks'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets {
    main {
        java.srcDir '../src/main/java'
        resources.srcDirs '../src/main/resources', '../src/generated/resources'
    }
}

loom {
    accessWidenerPath = file('../src/main/resources/sophisticatedbackpacks.accesswidener')

    mods {
        sophisticatedbackpacks {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'

    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.154.2+26.2'

    implementation fileTree(dir: '../SophisticatedCore/port-26.2/build/libs', include: ['sophisticatedcore-*.jar'])

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
