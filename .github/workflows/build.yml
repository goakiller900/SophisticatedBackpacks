name: Build JARs

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build SophisticatedBackpacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SophisticatedBackpacks
        uses: actions/checkout@v4
        with:
          path: workspace/SophisticatedBackpacks
          fetch-depth: 0

      - name: Checkout SophisticatedCore
        uses: actions/checkout@v4
        with:
          repository: goakiller900/SophisticatedCore
          ref: 1.21.x-fabric
          path: workspace/SophisticatedCore
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            workspace/SophisticatedBackpacks/**/*.gradle*
            workspace/SophisticatedBackpacks/gradle/wrapper/gradle-wrapper.properties
            workspace/SophisticatedCore/**/*.gradle*
            workspace/SophisticatedCore/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x workspace/SophisticatedCore/gradlew
          chmod +x workspace/SophisticatedBackpacks/gradlew

      # Backpacks relies on Loom injected interfaces declared by Core in
      # fabric.mod.json. A Gradle composite source substitution does not expose
      # those injected interfaces to Backpacks' Minecraft compile classpath in
      # CI, so build the real Core mod JAR and publish it to Maven Local first.
      - name: Build and publish SophisticatedCore locally
        working-directory: workspace/SophisticatedCore
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_USERNAME: ${{ github.actor }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: ./gradlew clean build publishToMavenLocal --stacktrace

      - name: Build SophisticatedBackpacks JARs
        working-directory: workspace/SophisticatedBackpacks
        env:
          USERNAME: ${{ github.actor }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: ./gradlew clean build --stacktrace

      - name: List generated JARs
        if: success()
        working-directory: workspace/SophisticatedBackpacks
        run: ls -lah build/libs/*.jar

      - name: Read project version
        if: success()
        id: version
        working-directory: workspace/SophisticatedBackpacks
        shell: bash
        run: |
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          RELEASE_TAG="v${MINECRAFT_VERSION}-${MOD_VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedBackpacks-${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}-build.${{ github.run_number }}
          path: workspace/SophisticatedBackpacks/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Create tagged GitHub Release and attach JARs
        if: github.event_name == 'workflow_dispatch' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.minecraft_version }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" workspace/SophisticatedBackpacks/build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "SophisticatedBackpacks ${MINECRAFT_VERSION}-${MOD_VERSION} (Build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
