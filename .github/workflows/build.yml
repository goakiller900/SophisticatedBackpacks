name: Build JARs

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build SophisticatedBackpacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SophisticatedBackpacks
        uses: actions/checkout@v4
        with:
          path: workspace/SophisticatedBackpacks
          fetch-depth: 0

      - name: Checkout SophisticatedCore
        uses: actions/checkout@v4
        with:
          repository: goakiller900/SophisticatedCore
          ref: 1.21.x-fabric
          path: workspace/SophisticatedCore
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            workspace/SophisticatedBackpacks/**/*.gradle*
            workspace/SophisticatedBackpacks/gradle/wrapper/gradle-wrapper.properties
            workspace/SophisticatedCore/**/*.gradle*
            workspace/SophisticatedCore/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x workspace/SophisticatedCore/gradlew
          chmod +x workspace/SophisticatedBackpacks/gradlew

      # Ask Gradle for the project version instead of duplicating Core's version
      # calculation in shell. GITHUB_RUN_NUMBER and GITHUB_REF are already part
      # of the Actions environment used by Core's Gradle build.
      - name: Determine SophisticatedCore CI version
        id: core-version
        working-directory: workspace/SophisticatedCore
        shell: bash
        run: |
          CORE_VERSION=$(./gradlew -q properties --property version | sed -n 's/^version: //p' | tail -n 1)
          if [[ -z "$CORE_VERSION" ]]; then
            echo "Unable to determine SophisticatedCore's Gradle project version" >&2
            exit 1
          fi
          echo "core_version=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Gradle reports SophisticatedCore version: ${CORE_VERSION}"

      - name: Build and publish SophisticatedCore locally
        working-directory: workspace/SophisticatedCore
        run: ./gradlew clean build publishToMavenLocal --stacktrace

      - name: Verify locally published SophisticatedCore coordinates
        working-directory: workspace/SophisticatedCore
        shell: bash
        env:
          CORE_VERSION: ${{ steps.core-version.outputs.core_version }}
        run: |
          CORE_GROUP=$(sed -n 's/^mod_group_id=//p' gradle.properties | tr -d '\r' | xargs)
          CORE_ARTIFACT=$(sed -n 's/^mod_id=//p' gradle.properties | tr -d '\r' | xargs)
          CORE_REPOSITORY_PATH="$HOME/.m2/repository/${CORE_GROUP//.//}/${CORE_ARTIFACT}/${CORE_VERSION}"
          CORE_JAR="${CORE_REPOSITORY_PATH}/${CORE_ARTIFACT}-${CORE_VERSION}.jar"
          test -f "${CORE_REPOSITORY_PATH}/${CORE_ARTIFACT}-${CORE_VERSION}.pom"
          test -f "$CORE_JAR"
          test -f "${CORE_REPOSITORY_PATH}/${CORE_ARTIFACT}-${CORE_VERSION}.module"
          jar tf "$CORE_JAR" | grep -Fx 'sophisticatedcore.mixins.json'
          jar tf "$CORE_JAR" | grep -Fx 'sophisticatedcore.accesswidener'
          unzip -p "$CORE_JAR" fabric.mod.json | grep -F '"loom:injected_interfaces"'
          unzip -p "$CORE_JAR" fabric.mod.json | grep -F 'net/p3pp3rf1y/sophisticatedcore/extensions/item/SophisticatedItemStack'
          unzip -p "$CORE_JAR" fabric.mod.json | grep -F 'net/p3pp3rf1y/sophisticatedcore/extensions/entity/SophisticatedPlayer'
          echo "Verified ${CORE_GROUP}:${CORE_ARTIFACT}:${CORE_VERSION} in Maven Local"

      - name: Build SophisticatedBackpacks JARs
        working-directory: workspace/SophisticatedBackpacks
        run: ./gradlew clean build "-Psc_version=${{ steps.core-version.outputs.core_version }}" --stacktrace

      - name: Audit remapped SophisticatedBackpacks JAR
        working-directory: workspace/SophisticatedBackpacks
        shell: bash
        env:
          CORE_VERSION: ${{ steps.core-version.outputs.core_version }}
        run: |
          MAIN_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$MAIN_JAR"
          jar tf "$MAIN_JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$MAIN_JAR" | grep -Fx 'sophisticatedbackpacks.mixins.json'
          jar tf "$MAIN_JAR" | grep -Fx 'sophisticatedbackpacks.accesswidener'
          jar tf "$MAIN_JAR" | grep -Fx 'assets/sophisticatedbackpacks/items/backpack.json'
          python3 - "$MAIN_JAR" "$CORE_VERSION" <<'PY'
          import json
          import sys
          import zipfile

          jar_path, ci_core_version = sys.argv[1:]
          with zipfile.ZipFile(jar_path) as jar_file:
              metadata = json.loads(jar_file.read("fabric.mod.json"))

          expected_core_dependency = ">=26.2-1.2.9.21 <26.3"
          actual_core_dependency = metadata.get("depends", {}).get("sophisticatedcore")
          if actual_core_dependency != expected_core_dependency:
              raise SystemExit(
                  "Unexpected SophisticatedCore dependency predicate: "
                  f"{actual_core_dependency!r}; expected {expected_core_dependency!r}"
              )
          if actual_core_dependency == ci_core_version:
              raise SystemExit("The distributable must not require one CI-specific Core build")

          print(f"Verified SophisticatedCore dependency predicate: {actual_core_dependency}")
          PY
          echo "Audited remapped JAR: $MAIN_JAR"

      - name: List generated JARs
        if: success()
        working-directory: workspace/SophisticatedBackpacks
        run: ls -lah build/libs/*.jar

      - name: Read project version
        if: success()
        id: version
        working-directory: workspace/SophisticatedBackpacks
        shell: bash
        run: |
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          ROLLING_TAG="latest-${MINECRAFT_VERSION}"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rolling_tag=${ROLLING_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedBackpacks-${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}-build.${{ github.run_number }}
          path: workspace/SophisticatedBackpacks/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # Keep one rolling release per Minecraft version. Every successful push to
      # the main development branch replaces the previous release and all of its
      # attached JARs. Manual workflow runs do the same.
      - name: Replace rolling GitHub Release with latest JARs
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/1.21.x-fabric') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ steps.version.outputs.rolling_tag }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.minecraft_version }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        shell: bash
        run: |
          # Remove the old rolling release and its tag so the new tag always
          # points at the exact commit that produced these JARs.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$ROLLING_TAG" workspace/SophisticatedBackpacks/build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "SophisticatedBackpacks ${MINECRAFT_VERSION} - Latest Build" \
            --notes "Automated rolling build of SophisticatedBackpacks ${MINECRAFT_VERSION}-${MOD_VERSION}. Actions build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}. This release is replaced after every successful build of 1.21.x-fabric."
